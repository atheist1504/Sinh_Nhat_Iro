<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chúc mừng sinh nhật Iro - 17/11</title>
<meta name="description" content="Một món quà nhỏ Đạt gửi Iro nhân ngày 17/11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =============================================================
   CHỈNH NHANH: tên, lời thư, ảnh... nằm trong CONFIG ở cuối file.
   ============================================================= */
:root{
  --aqua:#7ff6ff;
  --aqua-glow:rgba(0,255,255,.55);
  --pink:#ff9ccf;
  --pink-glow:rgba(255,105,180,.7);
  --gold:#ffe3a5;
  --ink:#f6fbff;
  --bg1:#05040d;
  --bg2:#140a2a;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);
  font-family:'Courier Prime',monospace;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{position:relative}

/* ---------- nền ---------- */
#sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 120%,#2a1350 0%,var(--bg2) 38%,var(--bg1) 75%,#000 100%);
  opacity:0;transition:opacity 2.4s ease}
#sky.on{opacity:1}
#sky.warm{background:radial-gradient(ellipse at 50% 110%,#5a1d4a 0%,#2a0f37 40%,#0b0514 78%,#000 100%)}
.star{position:absolute;border-radius:50%;background:#fff;opacity:.2;animation:tw var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
#fx{position:fixed;inset:0;z-index:6;pointer-events:none}

/* ---------- lớp trang trí theo lời chúc ---------- */
.decor{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.decor.on{opacity:1}
.float{position:absolute;bottom:-40px;left:var(--x);font-size:var(--s);color:var(--c);opacity:0;
  animation:rise var(--d) linear infinite;animation-delay:var(--dl);text-shadow:0 0 12px currentColor}
@keyframes rise{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.95}85%{opacity:.8}
  100%{transform:translate(var(--dr),-112vh) rotate(260deg);opacity:0}}
.balloon{position:absolute;bottom:-160px;left:var(--x);width:var(--w);height:calc(var(--w)*1.22);border-radius:50% 50% 48% 48%/55% 55% 45% 45%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),transparent 22%),var(--c);
  box-shadow:inset -8px -12px 22px rgba(0,0,0,.18),0 0 26px color-mix(in srgb,var(--c) 50%,transparent);
  animation:float var(--d) ease-in infinite;animation-delay:var(--dl);opacity:.92}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:90px;background:rgba(255,255,255,.35)}
.balloon::before{content:"";position:absolute;left:calc(50% - 5px);top:calc(100% - 3px);border:5px solid transparent;border-bottom-color:var(--c)}
@keyframes float{0%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(var(--dr),-60vh) rotate(4deg)}100%{transform:translate(0,-130vh) rotate(-3deg)}}

/* ---------- Shiroi ---------- */
#shiroi{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(var(--sc,1));z-index:5;
  transition:top 1.2s cubic-bezier(.2,.8,.2,1),transform 1.2s cubic-bezier(.2,.8,.2,1),opacity .8s ease;opacity:0}
#shiroi.on{opacity:1}
#shiroi.small{--sc:.55;top:15%}
#shiroi.tiny{--sc:.36;top:8%}
#shiroi.hide{opacity:0;pointer-events:none}
.eyes{display:flex;gap:96px;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.eyes.look-l{transform:translateX(-42px)}
.eyes.look-r{transform:translateX(42px)}
.eyes.scan{animation:scan 4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes scan{0%,100%{transform:translateX(0)}20%,30%{transform:translateX(-46px)}70%,80%{transform:translateX(46px)}}
.eye-wrap{width:128px;height:128px;display:flex;align-items:center;justify-content:center;position:relative}
.eye{width:128px;height:128px;border-radius:34px;background:var(--aqua);
  box-shadow:0 0 28px 8px var(--aqua-glow),0 0 60px 18px rgba(0,255,255,.28),inset 0 0 28px rgba(255,255,255,.9);
  transform:scaleY(0);transition:transform .45s cubic-bezier(.175,.885,.32,1.275),width .5s ease,height .5s ease,border-radius .5s ease,background .5s ease,box-shadow .5s ease,border-width .5s ease}
#shiroi.on .eye{transform:scaleY(1)}
.eye.blink{transform:scaleY(.06)!important;transition-duration:.09s}
/* mắt cười ^ ^ */
#shiroi.happy .eye{width:112px;height:56px;background:transparent;border:15px solid var(--aqua);border-bottom:0;
  border-radius:70px 70px 0 0;box-shadow:none;filter:drop-shadow(0 0 10px var(--aqua)) drop-shadow(0 0 22px rgba(0,255,255,.5));transform:translateY(-6px) scaleY(1)}
/* mắt trái tim khi đọc thư */
#shiroi.love .eye{background:var(--pink);box-shadow:0 0 28px 8px var(--pink-glow),inset 0 0 26px rgba(255,255,255,.85)}
.blush{position:absolute;top:118px;left:50%;transform:translateX(-50%);color:rgba(255,105,180,.85);font-weight:700;font-size:1.4rem;letter-spacing:2px;
  opacity:0;transition:opacity 1s ease .2s;text-shadow:0 0 10px rgba(255,105,180,.7)}
#shiroi.shy .blush,#shiroi.happy .blush,#shiroi.love .blush{opacity:1}
.mouth{position:absolute;left:50%;top:148px;transform:translateX(-50%);opacity:0;transition:opacity .8s ease}
#shiroi.on .mouth{opacity:1}
.mouth svg{width:64px;height:30px;overflow:visible}
.mouth path{fill:none;stroke:var(--aqua);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--aqua))}
#shiroi.love .mouth path{stroke:var(--pink);filter:drop-shadow(0 0 6px var(--pink))}
.party-hat{position:absolute;left:50%;top:-112px;transform:translateX(-50%) rotate(-8deg) scale(0);transform-origin:50% 100%;
  transition:transform .7s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 0 12px rgba(255,180,220,.5))}
#shiroi.hat .party-hat{transform:translateX(-50%) rotate(-8deg) scale(1)}

/* ---------- chữ ---------- */
#line{position:fixed;left:0;right:0;top:62%;z-index:7;text-align:center;padding:0 20px;pointer-events:none;
  font-size:clamp(1.45rem,4.6vw,3rem);letter-spacing:3px;line-height:1.35;color:#fff;
  text-shadow:0 0 18px rgba(255,255,255,.85),0 0 38px rgba(0,255,255,.5);min-height:2em}
#line.pink{color:#ffd0e6;text-shadow:0 0 16px #ff69b4,0 0 36px rgba(255,105,180,.5)}
#line.gold{color:#fff3d1;text-shadow:0 0 16px #ffc76b,0 0 36px rgba(255,180,90,.55)}
#line.high{top:19%;font-size:clamp(1.15rem,3.6vw,2.2rem)}
#line.low{top:auto;bottom:9%}
#line .ch{opacity:0;display:inline-block;transform:translateY(8px);animation:chIn .45s ease forwards}
@keyframes chIn{to{opacity:1;transform:none}}
#line.out{opacity:0;transition:opacity .45s ease}
.big-date{display:block;font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(4.2rem,17vw,9.5rem);letter-spacing:2px;line-height:1.05;
  background:linear-gradient(100deg,#ffd6ec,#fff6d6 40%,#b9f6ff 75%,#ffd6ec);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,170,220,.65));animation:shine 4s linear infinite}
@keyframes shine{to{background-position:-200% 0}}

#hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;font-size:.85rem;letter-spacing:2px;
  color:rgba(255,255,255,.55);opacity:0;transition:opacity .6s;pointer-events:none;animation:bob 1.8s ease-in-out infinite;white-space:nowrap}
#hint.on{opacity:1}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}

/* ---------- lyric hộp nhạc ---------- */
#lyric{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:8;text-align:center;font-size:.92rem;letter-spacing:2px;
  color:rgba(255,230,245,.0);transition:color .6s ease;pointer-events:none;font-style:italic}
#lyric.on{color:rgba(255,220,240,.62)}

/* ---------- màn mở đầu ---------- */
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#000;
  transition:opacity 1.2s ease;cursor:pointer;padding:24px;text-align:center}
#intro.gone{opacity:0;pointer-events:none}
.gift{width:132px;height:132px;position:relative;animation:wiggle 2.4s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(255,120,190,.45))}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-7deg)}82%{transform:rotate(6deg)}89%{transform:rotate(-4deg)}95%{transform:rotate(2deg)}}
#intro p{margin:0;letter-spacing:3px;font-size:1.05rem;color:#ffd7ea;text-shadow:0 0 12px rgba(255,105,180,.6)}
#intro small{letter-spacing:2px;color:rgba(255,255,255,.45);font-size:.82rem}

/* ---------- bánh kem ---------- */
#cake{position:fixed;left:50%;top:63%;transform:translate(-50%,-50%) scale(.6);z-index:5;opacity:0;pointer-events:none;
  transition:opacity 1s ease,transform 1.1s cubic-bezier(.34,1.56,.64,1)}
#cake.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#cake svg{width:min(78vw,340px);height:auto;display:block;overflow:visible}
.candle{cursor:pointer}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
.flame.out{animation:none;opacity:0;transition:opacity .25s ease}
@keyframes flick{0%{transform:scale(1,1) rotate(-3deg)}100%{transform:scale(.88,1.12) rotate(3deg)}}
.glow{transition:opacity .4s}
.smoke{opacity:0}
.smoke.go{animation:smoke 1.6s ease-out forwards}
@keyframes smoke{0%{opacity:.7;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(6px,-46px) scale(1.8)}}
#mic-btn{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;display:none;
  border:1px solid rgba(255,200,230,.45);background:rgba(255,120,190,.12);color:#ffe3f1;font:inherit;letter-spacing:2px;font-size:.85rem;
  padding:9px 18px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
#mic-btn.on{display:block}
#mic-btn.listening{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,140,200,.5)}50%{box-shadow:0 0 0 10px rgba(255,140,200,0)}}

/* ---------- thư ---------- */
#letter-stage{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity 1s ease}
#letter-stage.on{opacity:1;pointer-events:auto}
.envelope{width:min(80vw,330px);aspect-ratio:1.5;position:relative;cursor:pointer;animation:hover 3s ease-in-out infinite;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.envelope .body{position:absolute;inset:0;background:linear-gradient(160deg,#ffe2ef,#ffc2dc);border-radius:10px}
.envelope .flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(180deg,#ffb0d2,#ff9cc8);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:50% 0;transition:transform .8s ease;z-index:2;border-radius:10px 10px 0 0}
.envelope.open .flap{transform:rotateX(180deg)}
.envelope .seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-30%);z-index:3;font-size:2.2rem;filter:drop-shadow(0 0 8px rgba(255,80,150,.6));transition:opacity .4s}
.envelope.open .seal{opacity:0}
.envelope .to{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:'Dancing Script',cursive;font-size:1.6rem;color:#b03a74;z-index:1}
.paper{position:relative;width:min(92vw,560px);max-height:min(82vh,760px);overflow:auto;padding:34px 30px 28px;border-radius:14px;
  background:linear-gradient(180deg,#fffaf3,#fff2f7);color:#5a2b45;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 60px rgba(255,150,200,.25);
  display:none;transform:translateY(30px) scale(.96);opacity:0;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s ease;-webkit-overflow-scrolling:touch}
.paper.on{display:block}
.paper.show{transform:none;opacity:1}
.paper::before{content:"";position:absolute;inset:10px;border:1px dashed rgba(200,90,140,.28);border-radius:10px;pointer-events:none}
.paper h3{margin:0 0 14px;font-family:'Dancing Script',cursive;font-size:2.1rem;color:#c2447f;font-weight:700}
.paper p{margin:0 0 12px;font-family:'Dancing Script',cursive;font-size:1.42rem;line-height:1.5;user-select:text;-webkit-user-select:text}
.paper .sign{text-align:right;margin-top:18px;font-size:1.6rem;color:#c2447f}
.paper .ln{opacity:0;transform:translateY(6px);transition:opacity .8s ease,transform .8s ease}
.paper .ln.in{opacity:1;transform:none}
.btn{display:inline-block;margin-top:14px;border:0;font:inherit;letter-spacing:2px;font-size:.92rem;padding:10px 20px;border-radius:999px;cursor:pointer;
  background:linear-gradient(90deg,#ff8cc6,#ffb37d);color:#fff;box-shadow:0 6px 22px rgba(255,120,180,.4)}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.4);box-shadow:none}

/* ---------- kết ---------- */
#finale{position:fixed;inset:0;z-index:11;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:8px;
  opacity:0;pointer-events:none;transition:opacity 1.4s ease}
#finale.on{opacity:1;pointer-events:auto}
#finale h1{margin:0;font-family:'Dancing Script',cursive;font-size:clamp(2.6rem,11vw,6rem);line-height:1.1;color:#ffe9f4;text-shadow:0 0 22px rgba(255,105,180,.75),0 0 50px rgba(255,180,100,.35)}
#finale .who{letter-spacing:4px;color:rgba(255,235,245,.8)}
#finale .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}

#mute{position:fixed;right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));z-index:25;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font-size:1.05rem;cursor:pointer;display:none;backdrop-filter:blur(6px)}
#mute.on{display:block}

@media (max-width:600px){
  .eyes{gap:56px}
  .eye-wrap,.eye{width:84px;height:84px}
  .eye{border-radius:24px}
  #shiroi.happy .eye{width:76px;height:38px;border-width:11px}
  .blush{top:80px;font-size:1.1rem} #shiroi{--bx:70px}
  .mouth{top:102px}
  .mouth svg{width:48px;height:24px}
  .party-hat{top:-84px}
  .party-hat svg{width:58px;height:74px}
  .eyes.look-l{transform:translateX(-26px)} .eyes.look-r{transform:translateX(26px)}
  #line{top:60%;letter-spacing:2px}
  .paper{padding:28px 20px 22px}
  .paper p{font-size:1.28rem}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<div id="sky" aria-hidden="true"></div>

<!-- trang trí cho từng lời chúc -->
<div class="decor" id="decor-balloons" aria-hidden="true"></div>
<div class="decor" id="decor-hearts" aria-hidden="true"></div>
<div class="decor" id="decor-petals" aria-hidden="true"></div>
<div class="decor" id="decor-sparkles" aria-hidden="true"></div>

<canvas id="fx" aria-hidden="true"></canvas>

<div id="lyric" aria-hidden="true"></div>

<!-- Shiroi -->
<div id="shiroi" aria-label="Shiroi" role="img">
  <div class="party-hat" aria-hidden="true">
    <svg width="80" height="100" viewBox="0 0 80 100">
      <defs><linearGradient id="hatG" x1="0" x2="1"><stop offset="0" stop-color="#ff8cc6"/><stop offset="1" stop-color="#ffc56b"/></linearGradient></defs>
      <path d="M40 8 L72 92 Q40 102 8 92 Z" fill="url(#hatG)"/>
      <path d="M24 50 L56 50 M18 68 L62 68 M13 84 L67 84" stroke="#fff" stroke-opacity=".7" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>
      <circle cx="40" cy="8" r="9" fill="#7ff6ff"/><circle cx="37" cy="5" r="3" fill="#fff"/>
    </svg>
  </div>
  <div class="eyes" id="eyes">
    <div class="eye-wrap"><div class="eye"></div></div>
    <div class="eye-wrap"><div class="eye"></div></div>
  </div>
  <div class="blush" style="left:calc(50% - var(--bx,112px))">////</div>
  <div class="blush" style="left:calc(50% + var(--bx,112px))">////</div>
  <div class="mouth" aria-hidden="true"><svg viewBox="0 0 64 30"><path id="mouth-path" d="M8 8 Q20 22 32 10 Q44 22 56 8"/></svg></div>
</div>

<div id="line" aria-live="polite"></div>
<div id="hint">chạm để tiếp ›</div>

<!-- bánh kem -->
<div id="cake" aria-label="Bánh sinh nhật, chạm vào nến để thổi">
  <svg id="cake-svg" viewBox="0 0 340 300"></svg>
</div>
<button id="mic-btn" type="button">🎤 thổi thật vào mic</button>

<!-- thư -->
<div id="letter-stage">
  <div class="envelope" id="envelope" role="button" aria-label="Mở thư">
    <div class="body"></div><div class="flap"></div><div class="seal">💌</div>
    <div class="to" id="env-to"></div>
  </div>
  <div class="paper" id="paper"></div>
</div>

<!-- kết -->
<section id="finale">
  <div style="font-size:2.6rem">🎂</div>
  <h1 id="finale-title"></h1>
  <div class="who" id="finale-who"></div>
  <div class="row">
    <button class="btn" id="replay" type="button">xem lại từ đầu</button>
    <button class="btn ghost" id="reread" type="button">đọc lại thư</button>
  </div>
</section>

<button id="mute" type="button" aria-label="Tắt / bật nhạc">♪</button>

<!-- mở đầu -->
<div id="intro" role="button" aria-label="Mở quà">
  <svg class="gift" viewBox="0 0 120 120" aria-hidden="true">
    <rect x="14" y="50" width="92" height="62" rx="8" fill="#ff8cc6"/>
    <rect x="8" y="36" width="104" height="22" rx="6" fill="#ffa8d4"/>
    <rect x="52" y="36" width="16" height="76" fill="#7ff6ff"/>
    <path d="M60 36 C40 10 18 22 34 34 C40 38 52 37 60 36 C68 37 80 38 86 34 C102 22 80 10 60 36Z" fill="none" stroke="#7ff6ff" stroke-width="7" stroke-linejoin="round"/>
  </svg>
  <p id="intro-text"></p>
  <small>bật âm lượng lên rồi chạm vào hộp quà nha 🔊</small>
</div>

<script>
/* =============================================================
   CONFIG — sửa ở đây là đủ
   ============================================================= */
const CONFIG = {
  ten: "Iro",                 // tên người nhận
  tu: "Đạt",                  // người gửi
  ngay: "17/11",
  soNen: 3,                   // số cây nến trên bánh (đổi thành tuổi nếu muốn, tối đa ~9 cho đẹp)
  // Nhạc: để file "music.mp3" cạnh index.html này thì trang sẽ phát file đó.
  // Không có file thì trang tự chơi giai điệu Happy Birthday kiểu hộp nhạc.
  nhac: "music.mp3",          // 好きだから。 - ユイカ
  batDau: 0,                  // giây bắt đầu phát: 0 = từ đầu bài (58.7 = ngay đầu điệp khúc thứ nhất)
  ketThuc: 289,               // giây kết thúc đoạn lặp (bỏ khoảng lặng cuối bài); 0 = phát hết bài rồi quay về batDau
  // Lời chạy theo nhạc (tùy chọn), thời gian tính theo giây trong bài:
  // loiBaiHat: [ { t: 62.0, chu: "câu thứ nhất" }, { t: 65.4, chu: "câu thứ hai" } ],
  loiBaiHat: [],
  thu: [ // từng đoạn trong lá thư
    "Chúc mừng sinh nhật!",
    "Thêm một tuổi mới rồi đó. Mong là năm nay sẽ được ăn thật nhiều đồ ngon, ngủ thật đủ giấc, và gặp toàn những người tử tế.",
    "Chúc luôn khỏe mạnh, học hành hay công việc gì cũng suôn sẻ, và những điều đang ấp ủ sẽ dần dần thành sự thật.",
    "Có những hôm mệt mỏi thì nhớ là vẫn luôn có người sẵn sàng ngồi nghe kể chuyện nha.",
    "Cảm ơn vì đã là một phần thật dễ thương trong những ngày đã qua. Tuổi mới cứ cười thật nhiều vào nhé!"
  ]
};

/* ============================================================= */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- pháo hoa / confetti ---------- */
const fx = (() => {
  const c = $('#fx'), ctx = c.getContext('2d'); let W, H, dpr, parts = [], running = false;
  const resize = () => { dpr = Math.min(devicePixelRatio || 1, isMobile ? 1.5 : 2); W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  addEventListener('resize', resize); resize();
  const cols = ['#ff8cc6', '#ffc56b', '#7ff6ff', '#c9a7ff', '#fff3c4', '#ff6f91', '#9df2c4'];
  function loop() {
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.rot += p.vr;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.col;
      if (p.kind === 'conf') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2 * Math.abs(Math.cos(p.rot * 2)) + 1); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill(); if (p.trail) { ctx.globalAlpha *= .35; ctx.beginPath(); ctx.arc(p.x - p.vx * 2, p.y - p.vy * 2, p.s * .8, 0, 7); ctx.fill(); } }
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(loop); else { running = false; ctx.clearRect(0, 0, W, H); }
  }
  const go = () => { if (!running) { running = true; requestAnimationFrame(loop); } };
  return {
    confetti(n = 160) {
      for (let i = 0; i < n; i++) {
        const fromLeft = i % 2 === 0;
        parts.push({ kind: 'conf', x: fromLeft ? -10 : W + 10, y: H * rand(.55, .85), vx: (fromLeft ? 1 : -1) * rand(5, 13), vy: -rand(8, 17),
          g: .32, drag: .985, s: rand(6, 11), col: cols[i % cols.length], life: rand(2.2, 3), decay: .009, rot: rand(0, 6), vr: rand(-.25, .25) });
      }
      go();
    },
    burst(x, y, n = 70) {
      const col = cols[(Math.random() * cols.length) | 0], col2 = cols[(Math.random() * cols.length) | 0];
      for (let i = 0; i < n; i++) {
        const a = Math.PI * 2 * i / n + rand(-.05, .05), sp = rand(2.2, 5.6);
        parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: .045, drag: .975, s: rand(1.4, 2.6), col: i % 3 ? col : col2, life: 1.2, decay: rand(.011, .018), rot: 0, vr: 0, trail: true });
      }
      go();
    },
    show(times = 6, gap = 420) {
      for (let i = 0; i < times; i++) setTimeout(() => this.burst(rand(W * .15, W * .85), rand(H * .12, H * .45), isMobile ? 50 : 80), i * gap);
    }
  };
})();

/* ---------- âm nhạc ---------- */
const music = (() => {
  let ac = null, master = null, mode = null, audioEl = null, muted = false, timer = null, nextLoopAt = 0;
  const lyricEl = $('#lyric');
  const N = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, C3: 130.81, F2: 87.31, G2: 98, E3: 164.81, A2: 110 };
  // Happy Birthday (giai điệu dân gian, public domain) — [nốt, số phách]
  const mel = [['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
               ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
               ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
               ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3]];
  const bass = [[1, 'C3'], [4, 'G2'], [7, 'G2'], [10, 'C3'], [13, 'C3'], [16, 'F2'], [19, 'C3'], [21, 'G2'], [22, 'C3']];
  const lyr = [[0, 'happy birthday to you'], [6, 'happy birthday to you'], [12, `happy birthday dear ${CONFIG.ten}`], [19, 'happy birthday to you']];
  const BEAT = .56, LOOP_BEATS = 27;

  function note(freq, t, dur, vol, type = 'sine') {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq; o2.type = 'sine'; o2.frequency.value = freq * 2.01;
    const g2 = ac.createGain(); g2.gain.value = .18;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(vol * .35, t + .25); g.gain.exponentialRampToValueAtTime(.0005, t + Math.max(.6, dur * 1.9));
    o.start(t); o2.start(t); o.stop(t + dur * 2 + .2); o2.stop(t + dur * 2 + .2);
  }
  function scheduleLoop(t0) {
    let b = 0;
    for (const [n, d] of mel) { note(N[n], t0 + b * BEAT, d * BEAT, .16, 'triangle'); b += d; }
    for (const [bt, n] of bass) note(N[n], t0 + bt * BEAT, 2 * BEAT, .1, 'sine');
    for (const [bt, txt] of lyr) {
      const ms = (t0 + bt * BEAT - ac.currentTime) * 1000;
      setTimeout(() => { if (mode === 'synth' && !muted) { lyricEl.textContent = '♪ ' + txt + ' ♪'; lyricEl.classList.add('on'); } }, Math.max(0, ms));
    }
    setTimeout(() => lyricEl.classList.remove('on'), Math.max(0, (t0 + 25.5 * BEAT - ac.currentTime) * 1000));
  }
  function startSynth() {
    mode = 'synth';
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    master = ac.createGain(); master.gain.value = muted ? 0 : .9;
    // chút vang cho giống hộp nhạc
    const delay = ac.createDelay(); delay.delayTime.value = .23; const fb = ac.createGain(); fb.gain.value = .26;
    const wet = ac.createGain(); wet.gain.value = .35;
    master.connect(ac.destination); master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(ac.destination);
    nextLoopAt = ac.currentTime + .25;
    const tick = () => { while (nextLoopAt < ac.currentTime + 1.5) { scheduleLoop(nextLoopAt); nextLoopAt += LOOP_BEATS * BEAT; } };
    tick(); timer = setInterval(tick, 400);
  }
  return {
    start() {
      if (mode) return;
      // Bắt buộc tạo AudioContext ngay trong cú chạm để iPhone cho phát.
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const from = Math.max(0, +CONFIG.batDau || 0), to = +CONFIG.ketThuc || 0;
      audioEl = new Audio(); audioEl.preload = 'auto'; audioEl.volume = 0;
      audioEl.src = CONFIG.nhac + (from ? '#t=' + from : '');
      let decided = false;
      const fallback = () => { if (decided) return; decided = true; audioEl = null; startSynth(); };
      audioEl.addEventListener('error', fallback, { once: true });
      // lặp lại từ giây batDau (không lặp từ đầu bài)
      audioEl.addEventListener('ended', () => { audioEl.currentTime = from; audioEl.play().catch(() => {}); });
      const startFile = () => {
        decided = true; mode = 'file';
        if (from && audioEl.currentTime < from - 1) audioEl.currentTime = from;
        let v = 0; const fade = setInterval(() => { v = Math.min(1, v + .05); audioEl.volume = v; if (v >= 1) clearInterval(fade); }, 100);
        const cues = (CONFIG.loiBaiHat || []).slice().sort((a, b) => a.t - b.t); let shown = -1;
        setInterval(() => {
          if (!audioEl) return;
          const t = audioEl.currentTime;
          if (to && t >= to) { audioEl.currentTime = from; return; }
          if (!cues.length) return;
          let idx = -1; for (let i = 0; i < cues.length; i++) if (cues[i].t <= t + .05) idx = i;
          if (idx === shown) return; shown = idx;
          if (idx < 0 || muted) { lyricEl.classList.remove('on'); return; }
          lyricEl.classList.remove('on');
          setTimeout(() => { lyricEl.textContent = '♪ ' + cues[idx].chu + ' ♪'; lyricEl.classList.add('on'); }, 180);
        }, 150);
      };
      audioEl.play().then(() => { if (!decided) startFile(); }).catch(fallback);
      setTimeout(() => { if (!decided && audioEl && audioEl.paused) { try { audioEl.pause(); } catch (e) {} fallback(); } }, 2500);
      $('#mute').classList.add('on');
    },
    toggle() {
      muted = !muted;
      if (audioEl && mode === 'file') audioEl.muted = muted;
      if (master) master.gain.setTargetAtTime(muted ? 0 : .9, ac.currentTime, .1);
      if (muted) lyricEl.classList.remove('on');
      $('#mute').textContent = muted ? '✕' : '♪';
    },
    fanfare() { // tiếng "ting" khi thổi hết nến
      if (!ac || mode !== 'synth' || muted) return;
      const t = ac.currentTime + .05;
      [[1046.5, 0], [1318.5, .09], [1568, .18], [2093, .27]].forEach(([f, d]) => note(f, t + d, .3, .08, 'sine'));
    }
  };
})();
$('#mute').addEventListener('click', e => { e.stopPropagation(); music.toggle(); });

/* ---------- chữ ---------- */
const lineEl = $('#line'), hintEl = $('#hint');
async function say(html, { cls = '', typing = true } = {}) {
  lineEl.classList.add('out'); await sleep(lineEl.innerHTML ? 420 : 0);
  lineEl.className = cls;
  if (!typing) { lineEl.innerHTML = html; return; }
  // gõ từng chữ, vẫn giữ thẻ HTML
  const tmp = document.createElement('div'); tmp.innerHTML = html; let i = 0;
  const wrap = node => {
    if (node.nodeType === 3) {
      const frag = document.createDocumentFragment();
      node.textContent.split(/(\s+)/).forEach(word => {
        if (!word) return;
        if (/^\s+$/.test(word)) { frag.appendChild(document.createTextNode(' ')); return; }
        const w = document.createElement('span'); w.style.whiteSpace = 'nowrap'; // không cắt đôi một chữ khi xuống dòng
        for (const ch of word) {
          const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch; s.style.animationDelay = (i++ * 38) + 'ms'; w.appendChild(s);
        }
        frag.appendChild(w);
      });
      node.replaceWith(frag);
    } else [...node.childNodes].forEach(wrap);
  };
  [...tmp.childNodes].forEach(wrap);
  lineEl.innerHTML = ''; lineEl.append(...tmp.childNodes);
  await sleep(i * 38 + 300);
}
const clearLine = async () => { lineEl.classList.add('out'); await sleep(450); lineEl.innerHTML = ''; };

let waiter = null;
function tap(showHint = true) {
  hintEl.classList.toggle('on', showHint);
  return new Promise(r => { waiter = () => { hintEl.classList.remove('on'); r(); }; });
}
document.addEventListener('click', e => {
  if (e.target.closest('button, .envelope, .paper, #cake, #intro')) return;
  if (waiter) { const w = waiter; waiter = null; w(); }
});
document.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && waiter) { e.preventDefault(); const w = waiter; waiter = null; w(); } });

}
function blowCandles() {
  return new Promise(resolve => {
    const all = [...document.querySelectorAll('.candle')]; let left = all.length;
    const out = g => {
      if (g.dataset.out) return; g.dataset.out = 1; left--;
      g.querySelector('.flame').classList.add('out'); g.querySelector('.glow').style.opacity = 0;
      const sm = g.querySelector('.smoke'); sm.style.transformBox = 'fill-box'; sm.classList.add('go');
      if (left === 0) { stopMic(); setTimeout(resolve, 500); }
    };
    all.forEach(g => g.addEventListener('click', e => { e.stopPropagation(); out(g); }));
    blowCandles.outAll = () => all.forEach((g, i) => setTimeout(() => out(g), i * 90));
  });
}
let micStream = null, micRaf = 0;
function stopMic() { cancelAnimationFrame(micRaf); if (micStream) micStream.getTracks().forEach(t => t.stop()); micStream = null; $('#mic-btn').classList.remove('on', 'listening'); }
$('#mic-btn').addEventListener('click', async e => {
  e.stopPropagation();
  const btn = e.currentTarget;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    btn.classList.add('listening'); btn.textContent = '🌬️ thổi mạnh vào mic nào...';
    const ac = new (window.AudioContext || window.webkitAudioContext)(), an = ac.createAnalyser(); an.fftSize = 512;
    ac.createMediaStreamSource(micStream).connect(an); const buf = new Uint8Array(an.fftSize); let loud = 0;
    const check = () => {
      an.getByteTimeDomainData(buf); let sum = 0; for (const v of buf) sum += ((v - 128) / 128) ** 2;
      const rms = Math.sqrt(sum / buf.length);
      loud = rms > .22 ? loud + 1 : Math.max(0, loud - 1);
      if (loud > 8) { blowCandles.outAll && blowCandles.outAll(); ac.close(); return; }
      micRaf = requestAnimationFrame(check);
    };
    check();
  } catch (err) { btn.textContent = 'không mở được mic, chạm vào nến nha'; setTimeout(() => btn.classList.remove('on'), 2200); }
});

  buildCake(); $('#cake').classList.add('on');
  await say('nhắm mắt ước một điều thật đẹp<br>rồi chạm vào nến để thổi nhé 🕯️', { cls: 'high' });
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) { $('#mic-btn').textContent = '🎤 thổi thật vào mic'; $('#mic-btn').classList.add('on'); }
  await blowCandles();
  music.fanfare();
  fx.show(isMobile ? 6 : 9, 380); fx.confetti(isMobile ? 80 : 140);
  await say('yayyy 🎉 điều ước sẽ thành sự thật thôi!', { cls: 'high pink' });
  await tap();
  $('#cake').classList.remove('on');

  // lời chúc
  face({ mood: 'shy', mouth: 'w', hat: true });
  await say(`nhân ngày đặc biệt này,<br>chúc ${CONFIG.ten}...`); await tap();
  decor('decor-hearts'); face({ mood: 'happy', mouth: 'smile', hat: true });
  await say('tuổi mới thật nhiều sức khỏe', { cls: 'pink' }); await tap();
  decor('decor-petals'); face({ mood: 'shy', look: 'look-l', mouth: 'w', hat: true });
  await say('ngày càng xinh đẹp hơn nữa'); await tap();
  decor('decor-sparkles'); face({ mood: 'happy', mouth: 'smile', hat: true });
  await say('luôn giữ nụ cười thật tươi trên môi', { cls: 'gold' }); await tap();
  decor('decor-balloons'); face({ mood: 'happy', look: 'scan', mouth: 'smile', hat: true });
  await say('và mọi điều ước<br>đều sẽ thành hiện thực ✨'); fx.show(4, 500); await tap();

  // thư
  decor(null); face({ mood: 'love', mouth: 'w', hat: true });
  await say(`à, ${CONFIG.tu} còn gửi thêm<br>một lá thư nữa nè 💌`, { cls: 'pink' }); await tap();
  await clearLine(); sh.classList.add('hide');
  await openLetter();

  // kết
  await finale();
}
async function finale() {
  decor('decor-balloons');
  $('#finale-title').innerHTML = `Chúc mừng sinh nhật<br>Kawatai ${CONFIG.ten}`;
  $('#finale-who').textContent = `${CONFIG.ngay} • từ ${CONFIG.tu} & Shiroi 💖`;
  $('#finale').classList.add('on');
  fx.show(isMobile ? 7 : 10, 450); fx.confetti(isMobile ? 90 : 160);
  clearInterval(finale.t); finale.t = setInterval(() => fx.show(2, 600), 4500);
}
$('#replay').addEventListener('click', e => { e.stopPropagation(); location.reload(); });
$('#reread').addEventListener('click', async e => {
  e.stopPropagation(); clearInterval(finale.t); $('#finale').classList.remove('on'); await sleep(600);
  await openLetter(); await finale();
});

/* ---------- mở quà ---------- */
$('#intro-text').textContent = `có một món quà nhỏ cho ${CONFIG.ten} nè`;
document.title = `Chúc mừng sinh nhật ${CONFIG.ten} - ${CONFIG.ngay}`;
$('#intro').addEventListener('click', e => {
  e.stopPropagation();
  music.start();
  fx.confetti(isMobile ? 60 : 90);
  $('#intro').classList.add('gone');
  story();
}, { once: true });
</script>
</body>
</html>
